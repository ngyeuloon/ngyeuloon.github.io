<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="1020" height="660" role="img" aria-label="DJMAF architecture: sources feed an optional pre-ingestion structure check, ingestion into ADW, an always-on source and target count reconciliation, and an optional post-ingestion duplicate and null check. Passing runs write to a results table for the data analyst team. Failures raise a Priority 3 ServiceNow incident and an xMatters call to the on-call developer."><style>text{font-family:"IBM Plex Mono",Consolas,monospace}.box rect{fill:rgba(14,21,35,.86);stroke:#2E4756;stroke-width:1.3}.box.core rect{fill:rgba(255,180,58,.10);stroke:#FFB43A}.box.opt rect{fill:rgba(110,135,152,.12);stroke:#6E8798;stroke-dasharray:6 3}.box.dec rect{fill:rgba(255,255,255,.05);stroke:#8FA3B5}.box.cfg rect{fill:rgba(255,255,255,.04);stroke:#5A7080;stroke-dasharray:4 3}.box.src rect{fill:rgba(55,227,206,.06);stroke:rgba(55,227,206,.32)}.box.ok rect{fill:rgba(55,227,206,.09);stroke:#37E3CE}.box.bad rect{fill:rgba(255,74,51,.11);stroke:#FF4A33}.pill rect{fill:rgba(110,135,152,.12);stroke:rgba(55,227,206,.26);stroke-width:1}.t{font-size:12.5px;letter-spacing:.13em;fill:#DCE8F5;text-anchor:middle}.st{font-size:10.5px;letter-spacing:.05em;fill:#8FA3B5;text-anchor:middle}.tag{font-size:8.5px;letter-spacing:.16em;fill:#6E8798}.box.core+.tag,.tag.on{fill:#FFB43A}.flag{font-size:10.5px;letter-spacing:.16em}.flag.ok{fill:#37E3CE}.flag.bad{fill:#FF4A33}</style><rect width="1020" height="660" fill="#060911"/><defs><marker id="am" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0 0 L7 3.2 L0 6.4Z" fill="#5A7080"/></marker><marker id="ak" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0 0 L7 3.2 L0 6.4Z" fill="#37E3CE"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0 0 L7 3.2 L0 6.4Z" fill="#FF4A33"/></marker></defs><g class="box cfg"><rect x="400" y="8" width="250" height="48" rx="5"/><text x="525.0" y="24" class="t">commands.txt</text><text x="525.0" y="40" class="st">toggles the optional checks</text><text x="525.0" y="54" class="st">per project</text></g><path d="M304 84 V64 H928 V84" fill="none" stroke="#5A7080" stroke-width="1.2" stroke-dasharray="4 3" opacity=".75"/><path d="M525 64 V58" fill="none" stroke="#5A7080" stroke-width="1.2" stroke-dasharray="4 3" opacity=".75"/><g class="box src"><rect x="16" y="84" width="166" height="118" rx="5"/><text x="99" y="104" class="t">SOURCES</text></g><g class="pill"><rect x="28" y="112" width="142" height="20" rx="3"/><text x="99" y="126" class="st">API sources</text></g><g class="pill"><rect x="28" y="136" width="142" height="20" rx="3"/><text x="99" y="150" class="st">GFT file sources</text></g><g class="pill"><rect x="28" y="160" width="142" height="20" rx="3"/><text x="99" y="174" class="st">Direct database</text></g><g class="box opt"><rect x="214" y="84" width="180" height="118" rx="5"/><text x="304.0" y="134" class="t">PRE-INGESTION</text><text x="304.0" y="152" class="st">Source data structure</text><text x="304.0" y="164" class="st">vs ADW table structure</text></g><text x="385" y="99" class="tag" text-anchor="end">OPTIONAL</text><g class="box std"><rect x="426" y="84" width="180" height="118" rx="5"/><text x="516.0" y="141" class="t">INGESTION TO ADW</text><text x="516.0" y="158" class="st">Stage → Raw → Curated</text></g><g class="box core"><rect x="638" y="84" width="180" height="118" rx="5"/><text x="728.0" y="134" class="t">RECONCILIATION</text><text x="728.0" y="152" class="st">Source count check</text><text x="728.0" y="164" class="st">Target count check</text></g><text x="809" y="99" class="tag" text-anchor="end">ALWAYS ON</text><g class="box opt"><rect x="850" y="84" width="156" height="118" rx="5"/><text x="928.0" y="134" class="t">POST-INGESTION</text><text x="928.0" y="152" class="st">Duplicate check</text><text x="928.0" y="164" class="st">Null count check</text></g><text x="997" y="99" class="tag" text-anchor="end">OPTIONAL</text><path d="M182 143 H210" fill="none" stroke="#5A7080" stroke-width="1.5" marker-end="url(#am)"/><path d="M394 143 H422" fill="none" stroke="#5A7080" stroke-width="1.5" marker-end="url(#am)"/><path d="M606 143 H634" fill="none" stroke="#5A7080" stroke-width="1.5" marker-end="url(#am)"/><path d="M818 143 H846" fill="none" stroke="#5A7080" stroke-width="1.5" marker-end="url(#am)"/><path d="M928 202 V244 H516 V276" fill="none" stroke="#5A7080" stroke-width="1.5" marker-end="url(#am)"/><g class="box dec"><rect x="406" y="280" width="220" height="52" rx="5"/><text x="516.0" y="310" class="t">ALL CHECKS PASSED?</text></g><path d="M516 332 V362 H250 V388" fill="none" stroke="#37E3CE" stroke-width="1.5" marker-end="url(#ak)"/><path d="M516 332 V362 H782 V388" fill="none" stroke="#FF4A33" stroke-width="1.5" marker-end="url(#ab)"/><text x="240" y="382" class="flag ok" text-anchor="end">PASS</text><text x="794" y="382" class="flag bad" text-anchor="start">FAIL</text><g class="box ok"><rect x="110" y="392" width="280" height="66" rx="5"/><text x="250.0" y="423" class="t">RESULTS TABLE</text><text x="250.0" y="440" class="st">every check outcome, one table</text></g><path d="M250 458 V482" fill="none" stroke="#37E3CE" stroke-width="1.5" marker-end="url(#ak)"/><g class="box ok"><rect x="110" y="486" width="280" height="62" rx="5"/><text x="250.0" y="515" class="t">DATA ANALYST TEAM</text><text x="250.0" y="532" class="st">reads the results directly</text></g><g class="box bad"><rect x="642" y="392" width="280" height="66" rx="5"/><text x="782.0" y="423" class="t">SERVICENOW</text><text x="782.0" y="440" class="st">POST call raises a P3 incident</text></g><path d="M782 458 V482" fill="none" stroke="#FF4A33" stroke-width="1.5" marker-end="url(#ab)"/><g class="box bad"><rect x="642" y="486" width="280" height="62" rx="5"/><text x="782.0" y="515" class="t">XMATTERS</text><text x="782.0" y="532" class="st">calls the on-call rota</text></g><path d="M782 548 V572" fill="none" stroke="#FF4A33" stroke-width="1.5" marker-end="url(#ab)"/><g class="box bad"><rect x="642" y="576" width="280" height="62" rx="5"/><text x="782.0" y="605" class="t">ON-CALL DEVELOPER</text><text x="782.0" y="622" class="st">investigates and resolves</text></g></svg>